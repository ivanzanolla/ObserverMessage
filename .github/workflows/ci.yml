name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

      - name: Pack
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-ci.${GITHUB_RUN_NUMBER}"
          fi
          dotnet pack ObserverMessage --configuration Release --no-build --output artifacts -p:Version="$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: artifacts/*.nupkg

  test-netframework:
    # Runs the tests on .NET Framework 4.8, which uses the netstandard2.0 build of the library.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test on .NET Framework 4.8
        run: dotnet test ObserverMessage.Tests --configuration Release --framework net48 --verbosity normal

  publish:
    # Runs only for version tags such as v0.1.0, after build and tests pass.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, test-netframework]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # lets the job get a GitHub OIDC token for NuGet Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nuget-package
          path: artifacts

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Trusted Publishing: exchanges the OIDC token for a NuGet API key valid for one hour.
      # No long-lived key is stored in the repository.
      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}  # nuget.org profile name, not the email address

      - name: Push to nuget.org
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
